<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drupux</title>
  <meta name="description" content="Drupux — the AI-native platform for small businesses. Coming soon.">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    :root { --navy: #0E1726; --light: #E8EEF6; --muted: #9AA8BC; --amber: #F5A524; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--navy); color: var(--light); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 16px; }
    .logo { border-radius: 18px; margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: 36px; letter-spacing: -0.02em; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 18px; }
    .soon { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); border: 1px solid #24344F; border-radius: 999px; padding: 4px 12px; }
    footer { text-align: center; padding: 24px 16px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--light); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/logo.svg" alt="Drupux logo" width="72" height="72">
    <h1>Drupux</h1>
    <p>The AI-native platform for small businesses.</p>
    <span class="soon">Coming soon</span>
  </main>
  <footer>
    A <a href="https://sourcequarter.com">Source Quarter</a> product · © Source Quarter LLC
  </footer>
</body>
</html>
