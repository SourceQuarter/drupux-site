<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563EB">
  <title>Page not found · Drupux</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    :root { --blue: #2563EB; --blue-dark: #1E40AF; --blue-light: #DBEAFE; --ink: #0F172A; --muted: #475569; --bg: #FFFFFF; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 16px; }
    .logo { border-radius: 18px; margin-bottom: 24px; box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25); }
    h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: -0.03em; color: var(--ink); }
    p { margin: 0 0 20px; color: var(--muted); font-size: 18px; }
    .soon { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue-dark); background: var(--blue-light); border-radius: 999px; padding: 5px 14px; }
    .home { color: #fff; background: var(--blue); text-decoration: none; font-weight: 600; border-radius: 10px; padding: 10px 20px; }
    .home:hover { background: var(--blue-dark); }
    footer { text-align: center; padding: 24px 16px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--blue); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/logo.svg" alt="Drupux logo" width="72" height="72">
    <span class="soon">404</span>
    <h1 style="margin-top:16px">Page not found</h1>
    <p>This page doesn't exist.</p>
    <a class="home" href="/">Go to drupux.com</a>
  </main>
  <footer>
    A <a href="https://sourcequarter.com">Source Quarter</a> product · © Source Quarter LLC
  </footer>
</body>
</html>
